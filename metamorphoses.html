<html lang="en-US">
<style>

img {
   max-width: 100%;
   max-height: 100vh;
   min-width: 100px;
}

body {
   background-image: url(images/backgrounds/chipboard.jpg);
}

.space{
   margin-top: 4vh;
}

.grid{
    display: grid;
    position: fixed;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(1, 1fr);
    gap: 8px;
}

.b {
    grid-column-start: 7;
    grid-row-start: 1;
    margin-top: -4vh;
}

.a{
   margin-bottom: -20%
}

.flex-container {
  display: flex;
  margin: 1vh;
  padding: 2vh;
  padding-left: 2%;
  margin-top: 0vh;
  justify-content:space-around;
  align-items: center;
}

.hover_image:hover {text-decoration: none} 
.hide {display:none} 
.hover_image:hover 
   img:first-child{display:none} .hover_image:hover
   img:last-child{display:inline-block}

div {
    margin-top: 10px;
}

@font-face{
font-family: 'Quicktype';
font-family: 'Positions By Arixbored';
src: url('fonts/PositionsByArixbored-Regular\ .woff2') format('woff2'),
     url('fonts/PositionsByArixbored-Regular\ .woff') format('woff'),
     url('fonts/PositionsByArixbored-Regular\ .ttf') format('truetype'),
     url('fonts/PositionsByArixbored-Regular\ .eot') format('embedded-opentype'),
     url('fonts/PositionsByArixbored-Regular\ .svg') format('svg');
font-weight: normal;
font-style: normal;
}
   
h1{
   text-align: left;
   padding-left: 100px;
   font-family: 'Positions By Arixbored', monospace;
   font-size: 7vw;
   color:rgb(24, 173, 41);
   text-shadow: 4px 4px 4px #000000;   }
h2{
   text-align: left;
   padding-left: 3vw;
   font-size: 3vw;
   font-family: 'Positions By Arixbored', monospace;
   color:rgb(181, 240, 188);
   text-shadow: 4px 4px 4px #000000;   }

    </style>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Behlke</title>
  </head>
